# 데이터 점검 — 매달 「다시 볼 것」을 이슈로 만든다.
#
# 이 앱의 값은 대부분 남이 정한다. 요금은 사업자가 개정하고, 첫차는 다이어
# 개정으로 움직인다. 코드가 멀쩡해도 데이터는 가만히 있는 채로 틀려 가는데,
# 테스트도 타입 검사도 그걸 잡지 못한다.
#
# 사람이 기억해서 챙기는 일은 반드시 밀린다. 그래서 달마다 스스로 물어보게
# 하고, 결과를 이슈로 남긴다 — 화면 로그로만 흘리면 아무도 안 본다.
#
# 배포 워크플로와 달리 **실패시키지 않는다.** 데이터가 낡은 것은 버그가 아니라
# 할 일이라서, 빨간 불로 만들면 급한 수정을 못 내보내게 되고 결국 이 검사를
# 꺼 버리게 된다.

name: 데이터 점검

on:
  schedule:
    # 매달 1일 00:00 UTC (= 한국 09:00). 월초에 지난달 개정을 정리하기 좋다.
    - cron: '0 0 1 * *'
  # 손으로도 돌려볼 수 있게 — 큰 개정 소식을 들었을 때 바로 확인한다.
  workflow_dispatch:

concurrency:
  group: data-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      # 결과를 이슈로 남긴다
      issues: write
      contents: read

    steps:
      - name: 소스 받기
        uses: actions/checkout@v5
        with:
          # 스크립트가 `git grep` 을 쓴다. 얕게 받아도 작업 트리는 온전하다.
          fetch-depth: 1

      - name: Node 준비
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # audit-data 는 Node 내장만 쓴다. 아래 장소 대조가 tsx 로 앱 데이터를
      # 읽어야 해서 여기서 한 번만 설치한다.
      - name: 의존성
        run: npm ci

      - name: 점검
        id: audit
        run: |
          {
            echo 'report<<REPORT_EOF'
            node ./scripts/audit-data.mjs
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      # 가게가 아직 거기 있는지 원본(OSM)과 대조한다.
      #
      # 위 점검이 「반년 지났으니 사람이 봐라」라면 이쪽은 **기계가 직접
      # 확인해서 달라진 것만** 집어낸다. 폐업·이전이 여기서 잡힌다.
      #
      # 실패해도 넘어가는 이유는 두 가지다 — 급한 변경이 있으면 스크립트가
      # 1로 끝나는데 그게 워크플로를 죽이면 아래 이슈 만들기가 통째로 안 돌고,
      # 공개 오버패스 서버가 죽어 있는 날도 마찬가지다. **점검이 실패해도
      # 보고는 나가야 한다.**
      - name: 장소 원본 대조
        id: places
        continue-on-error: true
        run: |
          {
            echo 'report<<REPORT_EOF'
            node ./scripts/audit-places.mjs || true
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 결과를 이슈로
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.audit.outputs.report }}`;
            const places = `${{ steps.places.outputs.report }}`;

            /* 가게 쪽에 달라진 게 있나 — 없으면 「달라진 곳이 없어요」만 찍힌다 */
            const placesChanged = places.includes('달라진 곳 ');

            /*
             * 볼 게 없으면 이슈를 만들지 않는다.
             *
             * 매달 「할 일 없음」 이슈가 쌓이면 그 저장소의 이슈 목록이 소음이
             * 되고, 정작 진짜 이슈가 그 사이에 묻힌다. 「이상 없음」이 화면의
             * 주인공이 되지 않게 한다는 이 앱의 원칙 그대로다.
             */
            if (report.includes('다시 볼 항목이 없어요') && !placesChanged) {
              core.info('다시 볼 항목이 없어 이슈를 만들지 않습니다.');
              return;
            }

            const month = new Date().toISOString().slice(0, 7);
            const title = `데이터 점검 · ${month}`;

            /*
             * 같은 달 이슈가 이미 있으면 덮어쓴다.
             *
             * 손으로 다시 돌렸을 때 같은 제목이 두 개 생기면 어느 쪽이 최신인지
             * 알 수 없다. 하나를 갱신하는 편이 낫다.
             */
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-audit',
            });
            const same = existing.data.find((i) => i.title === title);

            const body = [
              '아래 항목의 값을 사업자 공식 페이지에서 다시 확인하고,',
              '맞으면 해당 항목의 `checkedAt` 을 이번 달로 옮기세요.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              /*
               * 가게 대조는 달라진 게 있을 때만 붙인다. 「이상 없음」을 매달
               * 같이 실어 보내면 이슈가 길어지고, 길어진 이슈는 안 읽힌다.
               */
              ...(placesChanged
                ? [
                    '## 가게가 아직 거기 있나 (OpenStreetMap 대조)',
                    '',
                    '`✗` 는 급한 것이에요 — 폐업이나 이전일 수 있습니다.',
                    'OSM 은 자원봉사 지도라 여기서 안 걸렸다고 확인된 건 아니에요.',
                    '',
                    '```',
                    places.trim(),
                    '```',
                    '',
                  ]
                : []),
              '<sub>`.github/workflows/data-audit.yml` 이 매달 1일에 자동으로 만듭니다.</sub>',
            ].join('\n');

            if (same) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: same.number,
                body,
              });
              core.info(`이슈 #${same.number} 갱신`);
            } else {
              const made = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['data-audit'],
              });
              core.info(`이슈 #${made.data.number} 생성`);
            }
