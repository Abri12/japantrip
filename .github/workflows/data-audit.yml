# 데이터 점검 — 매달 「다시 볼 것」을 이슈로 만든다.
#
# 이 앱의 값은 대부분 남이 정한다. 요금은 사업자가 개정하고, 첫차는 다이어
# 개정으로 움직인다. 코드가 멀쩡해도 데이터는 가만히 있는 채로 틀려 가는데,
# 테스트도 타입 검사도 그걸 잡지 못한다.
#
# 사람이 기억해서 챙기는 일은 반드시 밀린다. 그래서 달마다 스스로 물어보게
# 하고, 결과를 이슈로 남긴다 — 화면 로그로만 흘리면 아무도 안 본다.
#
# 배포 워크플로와 달리 **실패시키지 않는다.** 데이터가 낡은 것은 버그가 아니라
# 할 일이라서, 빨간 불로 만들면 급한 수정을 못 내보내게 되고 결국 이 검사를
# 꺼 버리게 된다.

name: 데이터 점검

on:
  schedule:
    # 매달 1일 00:00 UTC (= 한국 09:00). 월초에 지난달 개정을 정리하기 좋다.
    - cron: '0 0 1 * *'
  # 손으로도 돌려볼 수 있게 — 큰 개정 소식을 들었을 때 바로 확인한다.
  workflow_dispatch:

concurrency:
  group: data-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      # 결과를 이슈로 남긴다
      issues: write
      contents: read

    steps:
      - name: 소스 받기
        uses: actions/checkout@v5
        with:
          # 스크립트가 `git grep` 을 쓴다. 얕게 받아도 작업 트리는 온전하다.
          fetch-depth: 1

      - name: Node 준비
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # 의존성이 필요 없다 — 스크립트가 Node 내장만 쓴다. npm ci 를 건너뛰면
      # 점검 하나에 1분씩 쓰지 않는다.
      - name: 점검
        id: audit
        run: |
          {
            echo 'report<<REPORT_EOF'
            node ./scripts/audit-data.mjs
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: 결과를 이슈로
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.audit.outputs.report }}`;

            /*
             * 볼 게 없으면 이슈를 만들지 않는다.
             *
             * 매달 「할 일 없음」 이슈가 쌓이면 그 저장소의 이슈 목록이 소음이
             * 되고, 정작 진짜 이슈가 그 사이에 묻힌다. 「이상 없음」이 화면의
             * 주인공이 되지 않게 한다는 이 앱의 원칙 그대로다.
             */
            if (report.includes('다시 볼 항목이 없어요')) {
              core.info('다시 볼 항목이 없어 이슈를 만들지 않습니다.');
              return;
            }

            const month = new Date().toISOString().slice(0, 7);
            const title = `데이터 점검 · ${month}`;

            /*
             * 같은 달 이슈가 이미 있으면 덮어쓴다.
             *
             * 손으로 다시 돌렸을 때 같은 제목이 두 개 생기면 어느 쪽이 최신인지
             * 알 수 없다. 하나를 갱신하는 편이 낫다.
             */
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data-audit',
            });
            const same = existing.data.find((i) => i.title === title);

            const body = [
              '아래 항목의 값을 사업자 공식 페이지에서 다시 확인하고,',
              '맞으면 해당 항목의 `checkedAt` 을 이번 달로 옮기세요.',
              '',
              '```',
              report.trim(),
              '```',
              '',
              '<sub>`.github/workflows/data-audit.yml` 이 매달 1일에 자동으로 만듭니다.</sub>',
            ].join('\n');

            if (same) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: same.number,
                body,
              });
              core.info(`이슈 #${same.number} 갱신`);
            } else {
              const made = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['data-audit'],
              });
              core.info(`이슈 #${made.data.number} 생성`);
            }
